name: Ask AI

on:
  workflow_dispatch:

permissions:
  models: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: AI Inference
        id: ai-response
        uses: actions/ai-inference@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          model: openai/gpt-4o-mini
          prompt: |
            Give me one short programming joke. Return only the joke as plain text.

      - name: Display AI Response
        env:
          AI_RESPONSE: ${{ steps.ai-response.outputs.response }}
        run: |
          {
            echo "## 🤖 AI Response"
            echo
            printf '%s\n' "$AI_RESPONSE"
          } >> "$GITHUB_STEP_SUMMARY"
